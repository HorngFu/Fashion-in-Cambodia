name: 🐞 Bug report
description: Something on the website is broken or not working as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem. Screenshots help a lot.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap on …
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?

  - type: input
    id: url
    attributes:
      label: Page URL

  - type: dropdown
    id: language
    attributes:
      label: Site language
      options:
        - Khmer
        - English

  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. Android 14, Chrome / iPhone 13, Safari / Windows, Edge"
